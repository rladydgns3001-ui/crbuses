<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>GRX 회원 RPG 시제품</title>
<style>
  :root{
    --bg:#000000;--panel:#0e0e0e;--panel2:#161616;--line:#262626;--line2:#333333;
    --white:#ffffff;--muted:#9a9a9a;--muted2:#6a6a6a;--lime:#9bd13a;--lime-dk:#6f9a1f;--gold:#e8aa22;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg);color:var(--white);}
  body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;
    padding:20px 16px 40px;}
  .wrap{max-width:1040px;margin:0 auto;}
  .top{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-align-items:baseline;align-items:baseline;-webkit-justify-content:space-between;justify-content:space-between;margin-bottom:14px;}
  .tag{font-size:13px;letter-spacing:3px;color:var(--lime);font-weight:700;}
  h1{font-size:26px;font-weight:900;margin-top:2px;}
  .proto{font-size:12px;color:var(--muted2);border:1px solid var(--line2);border-radius:20px;padding:4px 10px;white-space:nowrap;}

  /* 무대 */
  .stage-card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:14px;position:relative;overflow:hidden;}
  #stageWrap{position:relative;text-align:center;line-height:0;}
  #stage{image-rendering:-moz-crisp-edges;image-rendering:-webkit-optimize-contrast;image-rendering:pixelated;image-rendering:crisp-edges;
    border-radius:12px;background:#0c0d11;max-width:100%;}

  /* HUD */
  .hud{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;margin-top:14px;}
  .lvbox{-webkit-flex:0 0 auto;flex:0 0 auto;text-align:center;min-width:112px;margin-right:16px;}
  .lvbox small{display:block;font-size:12px;letter-spacing:2px;color:var(--muted);font-weight:700;}
  #lv{display:inline-block;font-size:52px;font-weight:900;line-height:1;color:var(--lime);font-variant-numeric:tabular-nums;}
  #lv.pop{-webkit-animation:pop .28s ease-out;animation:pop .28s ease-out;}
  @-webkit-keyframes pop{0%{-webkit-transform:scale(1.35);color:#ffffff;}100%{-webkit-transform:scale(1);}}
  @keyframes pop{0%{transform:scale(1.35);color:#ffffff;}100%{transform:scale(1);}}
  .info{-webkit-flex:1;flex:1;min-width:0;}
  .row1{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:space-between;justify-content:space-between;margin-bottom:8px;}
  .title{display:inline-block;font-size:20px;font-weight:900;padding:5px 14px;border-radius:999px;border:1px solid var(--line2);background:var(--panel2);}
  .title.t1,.title.t2,.title.t3{color:var(--lime);border-color:rgba(155,209,58,.35);}
  .title.t4,.title.t5{color:#0b0b0b;background:var(--lime);border-color:var(--lime);}
  .title.t6{color:#0b0b0b;background:var(--gold);border-color:#ffe68a;box-shadow:0 0 14px rgba(232,170,34,.55);}
  .att{font-size:14px;color:var(--muted);} .att b{color:var(--white);font-size:18px;margin:0 2px;}
  .barbg{height:18px;border-radius:9px;background:#1b1d16;border:1px solid #2a3320;overflow:hidden;position:relative;}
  #bar{height:100%;width:0;background:var(--lime);border-radius:9px 0 0 9px;
    background-image:-webkit-linear-gradient(top,#c8f07a,#9bd13a 55%,#7cb02a);background-image:linear-gradient(to bottom,#c8f07a,#9bd13a 55%,#7cb02a);}
  .row2{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between;margin-top:6px;font-size:13px;color:var(--muted);}
  #xpTxt{white-space:nowrap;margin-left:10px;color:var(--white);font-weight:700;font-variant-numeric:tabular-nums;}

  /* 전직 배너 */
  .cu{position:absolute;left:0;right:0;top:12%;text-align:center;pointer-events:none;opacity:0;}
  .cu.show{-webkit-animation:cu 2.9s ease-out forwards;animation:cu 2.9s ease-out forwards;}
  .cu .l{display:inline-block;font-size:15px;font-weight:900;letter-spacing:8px;color:#0b0b0b;background:var(--lime);padding:5px 14px 5px 22px;border-radius:6px;}
  .cu .n{display:block;font-size:64px;font-weight:900;color:#ffffff;line-height:1.15;margin-top:6px;
    text-shadow:0 0 18px rgba(155,209,58,.95),0 0 4px #9bd13a,0 4px 0 #2d4a0c;}
  .cu.t6 .n{text-shadow:0 0 22px rgba(255,214,90,1),0 0 6px #e8aa22,0 4px 0 #5a3608;}
  .cu.t6 .l{background:var(--gold);}
  .cu .s{display:block;font-size:17px;font-weight:800;color:var(--lime);margin-top:2px;text-shadow:0 2px 0 #000;}
  @-webkit-keyframes cu{0%{opacity:0;-webkit-transform:scale(.4);}10%{opacity:1;-webkit-transform:scale(1.18);}18%{-webkit-transform:scale(1);}82%{opacity:1;-webkit-transform:scale(1);}100%{opacity:0;-webkit-transform:scale(1.05);}}
  @keyframes cu{0%{opacity:0;transform:scale(.4);}10%{opacity:1;transform:scale(1.18);}18%{transform:scale(1);}82%{opacity:1;transform:scale(1);}100%{opacity:0;transform:scale(1.05);}}

  /* 테스트 */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:14px;}
  .ph{font-size:13px;letter-spacing:2px;color:var(--lime);font-weight:800;margin-bottom:12px;}
  .ctl{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-align-items:center;align-items:center;margin:-5px;}
  .ctl > *{margin:5px;}
  .ctl label{font-size:14px;color:var(--muted);}
  .ctl input{width:120px;height:52px;background:var(--panel2);border:1px solid var(--line2);border-radius:14px;color:#fff;font-size:22px;font-weight:800;text-align:center;font-family:inherit;outline:none;}
  .ctl input:focus{border-color:var(--lime);}
  button{height:52px;padding:0 20px;border-radius:14px;border:1px solid var(--line2);background:var(--panel2);color:var(--white);font-size:16px;font-weight:800;font-family:inherit;cursor:pointer;}
  button:active{border-color:var(--lime);color:var(--lime);}
  button.main{background:var(--lime);border-color:var(--lime);color:#0b0b0b;}
  button.main:active{background:var(--lime-dk);color:#0b0b0b;}
  .note{font-size:12px;color:var(--muted2);margin-top:10px;line-height:1.6;}

  table{width:100%;border-collapse:collapse;font-size:15px;}
  th{white-space:nowrap;font-size:12px;color:var(--muted2);text-align:left;font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);}
  td{padding:10px;border-bottom:1px solid #1a1a1a;font-variant-numeric:tabular-nums;}
  td:first-child{font-weight:800;}
  .chip{display:inline-block;white-space:nowrap;padding:3px 10px;border-radius:999px;font-weight:800;font-size:14px;border:1px solid var(--line2);}
  .chip.t1,.chip.t2,.chip.t3{color:var(--lime);border-color:rgba(155,209,58,.35);}
  .chip.t4,.chip.t5{background:var(--lime);color:#0b0b0b;border-color:var(--lime);}
  .chip.t6{background:var(--gold);color:#0b0b0b;border-color:#ffe68a;}
  details{margin-top:14px;}
  summary{cursor:pointer;color:var(--muted);font-size:14px;font-weight:700;padding:6px 0;}
  .scroll{max-height:360px;overflow-y:auto;-webkit-overflow-scrolling:touch;margin-top:8px;border:1px solid var(--line);border-radius:12px;}
  .scroll table{font-size:13px;} .scroll td{padding:6px 10px;}

  @media(max-width:680px){
    h1{font-size:21px;} .lvbox{min-width:84px;margin-right:12px;} #lv{font-size:40px;}
    .title{font-size:16px;padding:4px 10px;} .cu .n{font-size:40px;} .cu .l{font-size:12px;letter-spacing:5px;}
    .att{font-size:12px;} .att b{font-size:15px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><div class="tag">GRX FITNESS</div><h1>회원 RPG 캐릭터</h1></div>
    <div class="proto">시제품 · 테스트 화면</div>
  </div>

  <div class="stage-card">
    <div id="stageWrap"><canvas id="stage" width="160" height="98"></canvas></div>
    <div class="cu" id="classUp"><span class="l">전직</span><span class="n" id="cuName"></span><span class="s" id="cuSub"></span></div>
    <div class="hud">
      <div class="lvbox"><small>LEVEL</small><span id="lv">1</span></div>
      <div class="info">
        <div class="row1"><span class="title" id="title">루키</span><span class="att">누적 출석 <b id="attTxt">0</b>회</span></div>
        <div class="barbg"><div id="bar"></div></div>
        <div class="row2"><span id="nextTxt"></span><span id="xpTxt"></span></div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="ph">테스트</div>
    <div class="ctl">
      <label for="attInput">누적 출석</label>
      <input id="attInput" type="number" inputmode="numeric" min="0" max="99999" value="0">
      <button id="btnSet">이 상태로 보기</button>
      <button id="btn1" class="main">출석 1회</button>
      <button id="btn10" class="main">출석 10회</button>
      <button id="btnReset">처음으로</button>
    </div>
    <div class="note">출석 1회 = 경험치 100 · 최고 Lv.200 · 출석은 줄지 않으므로 레벨도 내려가지 않습니다. "이 상태로 보기"는 테스트용으로 입력한 누적 출석 상태를 바로 보여줍니다.</div>
  </div>

  <div class="panel">
    <div class="ph">레벨 구간표</div>
    <table>
      <thead><tr><th>레벨</th><th>누적 출석</th><th>칭호</th><th>누적 경험치</th></tr></thead>
      <tbody id="tierBody"></tbody>
    </table>
    <details>
      <summary>레벨별 필요 경험치 전체 보기 (Lv.1 ~ 200)</summary>
      <div class="scroll"><table>
        <thead><tr><th>레벨</th><th>다음 레벨까지</th><th>누적 경험치</th><th>누적 출석</th><th>칭호</th></tr></thead>
        <tbody id="allBody"></tbody>
      </table></div>
    </details>
  </div>
</div>

<script>
/* 레벨 규칙 (메이플스토리식)
 * - 최고 200레벨, 출석 1회 = 경험치 100
 * - XP_TABLE[i] = Lv.(i+1) 에서 Lv.(i+2) 로 오르는 데 필요한 경험치 (199개)
 * - 구간마다 지수 곡선(등비 증가)으로, 구간 경계에서 이어지게 계산. 누적 출석 기준
 *   Lv10=3회, Lv30=20회, Lv60=65회, Lv100=170회, Lv150=320회, Lv200=520회 에 정확히 맞춤
 * - 필요 경험치는 레벨이 오를수록 줄지 않음(단조 증가): 초반엔 출석 한 번에 여러 레벨, 후반엔 점점 느려짐
 */
var XP_TABLE = [
  12, 16, 19, 23, 29, 35, 44, 55, 67, 83,  // Lv.1~10
  83, 83, 84, 84, 84, 84, 84, 85, 85, 85,  // Lv.11~20
  85, 86, 86, 86, 86, 86, 87, 87, 87, 87,  // Lv.21~30
  91, 93, 97, 100, 103, 108, 110, 115, 119, 123,  // Lv.31~40
  127, 132, 137, 141, 146, 151, 156, 162, 168, 173,  // Lv.41~50
  180, 185, 193, 199, 206, 213, 220, 229, 236, 245,  // Lv.51~60
  245, 246, 247, 249, 249, 249, 251, 252, 252, 254,  // Lv.61~70
  254, 256, 256, 257, 258, 259, 260, 261, 262, 262,  // Lv.71~80
  264, 265, 265, 267, 267, 269, 269, 271, 271, 272,  // Lv.81~90
  274, 274, 275, 277, 277, 278, 279, 281, 281, 282,  // Lv.91~100
  283, 284, 284, 285, 286, 287, 287, 288, 288, 290,  // Lv.101~110
  290, 291, 291, 292, 293, 294, 294, 295, 296, 296,  // Lv.111~120
  298, 298, 298, 300, 300, 301, 302, 302, 303, 304,  // Lv.121~130
  305, 305, 306, 307, 308, 308, 309, 310, 311, 311,  // Lv.131~140
  312, 313, 314, 315, 315, 316, 317, 318, 318, 319,  // Lv.141~150
  322, 325, 328, 331, 333, 337, 340, 342, 346, 349,  // Lv.151~160
  352, 355, 358, 362, 364, 368, 371, 375, 378, 381,  // Lv.161~170
  384, 389, 391, 395, 398, 403, 405, 409, 413, 417,  // Lv.171~180
  420, 424, 428, 432, 435, 440, 443, 447, 451, 456,  // Lv.181~190
  459, 463, 468, 472, 476, 480, 484, 489, 493  // Lv.191~199
];
var TIERS = [
  { lv: 1,   name: "루키" },
  { lv: 10,  name: "챌린저" },
  { lv: 30,  name: "애슬릿" },
  { lv: 60,  name: "엘리트" },
  { lv: 100, name: "마스터" },
  { lv: 150, name: "그랜드마스터" },
  { lv: 200, name: "레전드" }
];
</script>
